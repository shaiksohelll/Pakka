kind = "web"
previewPath = "/"
title = "Pakka"
version = "1.0.0"
id = "artifacts/pakka"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21187

[services.development]
run = "pnpm --filter @workspace/pakka run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pakka", "run", "build" ]
publicDir = "artifacts/pakka/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21187"
BASE_PATH = "/"
